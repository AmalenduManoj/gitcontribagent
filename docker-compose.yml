services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: github_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d github_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://agent:agent@postgres:5432/github_agent
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL}
      CONTRIBUTION_LABELS: ${CONTRIBUTION_LABELS:-good first issue,good-first-issue,first issue,beginner,help wanted}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8080:8080"

volumes:
  pgdata:
